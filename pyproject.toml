[project]
name = "xbox360-mcp"
version = "0.1.0"
description = "MCP server + CLI + Python library to drive an Xbox 360 RGH/JTAG (xbdm) from Claude Code"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aymen" }]
dependencies = [
    "mcp>=2",
    "numpy>=1.24",
    "pillow>=10",
    "capstone>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
xbox360-mcp = "xbox360_mcp.server:main"
xbox360 = "xbox360_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xbox360_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
